<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="cgit-rs">
<meta name="robots" content="index, nofollow">
<title>{% block title %}git{% endblock %}</title>
<link rel="stylesheet" type="text/css" href="/static/cgit.css">
{% block head %}{% endblock %}
</head>
<body>
<div id="cgit">
{% block header %}{% endblock %}
{% block tabs %}{% endblock %}
{% block path_bar %}{% endblock %}
<div class="content">
{% block content %}{% endblock %}
<div class="footer">{% block footer %}generated by cgit-rs templates{% endblock %}</div>
</div>
</div>
</body>
</html>
