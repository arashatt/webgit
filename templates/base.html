<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="gitweb-rs">
<title>{% block title %}git{% endblock %}</title>
<link rel="stylesheet" type="text/css" href="/static/gitweb.css">
{% block head %}{% endblock %}
</head>
<body>

<div class="page_header">
<a class="logo" href="https://git-scm.com/" title="git homepage"><svg width="72" height="27" viewBox="0 0 72 27" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="git"><rect width="72" height="27" rx="3" fill="#f05133"/><text x="36" y="20" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#ffffff">git</text></svg></a>
{% block breadcrumb %}<a href="/">projects</a>{% endblock %}
</div>

{% block search %}{% endblock %}
{% block page_nav %}{% endblock %}
{% block nav_extra %}{% endblock %}
<div class="page_nav_gap"></div>

{% block content %}{% endblock %}

<div class="page_footer">
{% block footer %}<div class="page_footer_text"></div>{% endblock %}
</div>

</body>
</html>
