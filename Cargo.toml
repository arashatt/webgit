[package]
name = "example-form"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
askama = "0.16.1"
axum = "0.8.9"
git2 = { version = "0.21.0", features = ["https"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.7.1", features = ["full"] }
tower-layer = "0.3.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.3"
mime = "0.3.17"
tower = "0.5.2"
